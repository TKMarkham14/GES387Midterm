<!DOCTYPE html>
<html>
    <head>
        <title>Midterm</title>

        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
		  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
		  crossorigin=""/>

         <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
		  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
		  crossorigin=""></script>
		   
		<style type="text/css">
			html, body { margin: 0; padding: 0; height: 100%; }
			#map { min-height: 100%; }
			
		</style>
	
	
	<link rel="icon" href="geographer.png">
	
    </head>

    <body>
      <h1>New NEIU Geography Student Campus Map</h1>
		
		<div id="map"></div>
		
        <script type="text/javascript">

        var map = L.map('map', {
				center: [41.980181,-87.717741],
				zoom: 17
          });

        var street = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
				attribution: 'Powered by <a href="https://www.esri.com">Esri</a> | Sources: Esri, HERE, Garmin, USGS, Intermap, INCREMENT P, NRCan, Esri Japan, METI, Esri China (Hong Kong), Esri Korea, Esri (Thailand), NGCC, &copy; OpenStreetMap contributors, and the GIS User Community',
				maxZoom: 18,
				minZoom: 3
            }).addTo(map);
        

		var gray = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
			    attribution: 'Tiles &copy; <a href="https://www.esri.com/">Esri</a>',
			   
			    maxZoom: 18,
			    
				});
			
		var basemaps = {
		"ESRI World Street Map": street,
		"Light Gray Base": gray
		};	
		
		L.control.layers(basemaps, ).addTo(map);
			var BBH = L.icon({
				iconUrl: 'Bbh.png', // url that links to the icon image file, saved in the same folder as the current page 
				iconSize:     [38, 38], // size of the icon image in pixels
				iconAnchor:   [19, 19], // the top left corner of the icon will be aligned so that this point is at the marker's geographical location
				popupAnchor:  [0, -10] // point from which the popup should open, relative to the iconAnchor
			});
			var BBHTL = L.icon({
				iconUrl: 'bbhtl.png', // url that links to the icon image file, saved in the same folder as the current page 
				iconSize:     [38, 38], // size of the icon image in pixels
				iconAnchor:   [19, 19], // the top left corner of the icon will be aligned so that this point is at the marker's geographical location
				popupAnchor:  [0, -10] // point from which the popup should open, relative to the iconAnchor
			});
			var village = L.icon({
				iconUrl: 'village.png', // url that links to the icon image file, saved in the same folder as the current page 
				iconSize:     [38, 38], 
				iconAnchor:   [19, 19], 
				popupAnchor:  [0, -10] 
			});
			var library = L.icon({
				iconUrl: 'library.png', // url that links to the icon image file, saved in the same folder as the current page 
				iconSize:     [38, 38], 
				iconAnchor:   [19, 19],  
				popupAnchor:  [0, -10] 
			});
			var union = L.icon({
				iconUrl: 'union.png', // url that links to the icon image file, saved in the same folder as the current page 
				iconSize:     [38, 38], 
				iconAnchor:   [19, 19],  
				popupAnchor:  [0, -10] 
			});
			
			var pic1 = '<img src="BBH.jpg" alt="The center of life as a NEIU Geography student is BBH." width="250">';
			var pic2 = '<img src="village.jpg" alt="The social center of NEIU is the Village Square." width="250">';
			var pic3 = '<img src="Library.jpg" alt="NEIU Library" width="250">';
			var pic4 = '<img src="Union.jpg" alt="NEIU Student Union" width="250">';
			var pic5 = '<img src="prof_liu.jpg" alt="The savior of sanity as a NEIU Geography student is Professor and Advisor Ting Liu." width="250">';
			
			var marker1 = L.marker([41.980478,-87.716775], {icon: BBH, alt: 'An Image of Bernard Brummel Hall.'}).addTo(map);
			marker1.bindPopup("Bernard Brummel Hall (BBH), Where Geography lives at NEIU." + pic1);
			
			var marker2 = L.marker([41.981632,-87.718282], {icon: village, alt: 'The Village Square'}).addTo(map);
			marker2.bindPopup("Right through these doors, in the Village Square you can find fancy coffee, snacks, vending machine salads, and the hidden stairs to health services!" + pic2);

			var marker3 = L.marker([41.980328,-87.719146], {icon: library, alt: 'NEIU Library'}).addTo(map);
			marker3.bindPopup("NEIU Library houses a revolving art gallery and employs the kindest and most helpful librarians." + pic3);
			
			var marker4 = L.marker([41.981787,-87.718931], {icon: union, alt: 'NEIU Student Union'}).addTo(map);
			marker4.bindPopup("NEIU Student Union - the great connector. Student services, WZRD, the cafeteria, a place to sit and study, or decompress downstairs." + pic4);
			
			var marker5 = L.marker([41.980393,-87.717451], {icon: BBHTL, alt: 'The basic vicinity of the office of Ting Liu on the third floor of Bernard Brummel Hall.'}).addTo(map);
			marker5.bindPopup("Professor Ting Liu's office in Bernard Brummel Hall (BBH), Where Geography students go to be rescued at NEIU." + pic5);			
        </script>
   </body>
</html>
